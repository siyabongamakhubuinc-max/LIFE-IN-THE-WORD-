give:()=>pageHead('Give','Partnership for the building project and other giving options.')+`<section class="sec w grid c2"><form id="gf" novalidate><label>Fund<select name="fund">${D.funds.map(f=>`<option>${f}</option>`).join('')}</select></label><div><div class="amts">${[100,200,500,1000].map(a=>`<button type="button" data-a="${a}">R${a}</button>`).join('')}</div></div><label>Amount (ZAR, min R10)<input name="amount" type="number" min="10" step="1" inputmode="numeric" required></label><label>First name<input name="first" autocomplete="given-name" required></label><label>Last name<input name="last" autocomplete="family-name" required></label><label>Email for your receipt<input name="email" type="email" autocomplete="email" required></label><label class="chk"><input type="checkbox" name="ok" required><span>I accept the <a href="#/policies/terms">Terms</a>, <a href="#/policies/refunds">Giving and Refund Policy</a> and <a href="#/policies/privacy">Privacy Policy</a>.</span></label><p class="err" id="ge" role="alert"></p><button class="btn">Continue to giving</button><div class="pf">Online giving is available only after the church activates its secure payment gateway. No card details are collected on this page.</div></form><div><h3>Prefer EFT?</h3><div class="note"><b>${D.eft.bank}</b><br>Account: <b>${D.eft.acc}</b><br>${D.eft.note}</div><p class="sm mute" style="margin-top:14px">Please confirm account details with the church office before your first transfer.</p></div></section>`,
pray:()=>pageHead('Prayer requests','Your request goes to Pastor P. Makhubu and is handled in confidence.')+`<section class="sec w"><form data-k="prayer"><label>Your name (optional)<input name="name"></label><label>Phone or email (optional, if you want a reply)<input name="reach"></label><label>Prayer request<textarea name="msg" rows="5" required></textarea></label>${consent}<button class="btn">Send prayer request</button><p class="ok" role="status"></p></form></section>`,
journal:()=>{const f=D.facebook,u=f.page;return pageHead('Journal','News and updates from our Facebook page.')+`<section class="sec w">${u?`<iframe height="640" loading="lazy" title="Facebook feed" src="https://www.facebook.com/plugins/page.php?href=${encodeURIComponent(u)}&tabs=timeline&width=500&height=640&small_header=true"></iframe>`:''}<p style="margin-top:14px"><a class="btn" target="_blank" rel="noopener" href="${u||'https://www.facebook.com/search/top?q='+encodeURIComponent(f.search)}">Follow us on Facebook</a></p></section>`},
contact:()=>pageHead('Contact us')+`<section class="sec w grid c2"><div>${contactLines()}<p class="mute">8 Platina Drive, Thabazimbi Industrial Area.</p></div><form data-k="contact"><label>Name<input name="name" required></label><label>Email or phone<input name="reach" required></label><label>Message<textarea name="msg" rows="5" required></textarea></label>${consent}<button class="btn">Send message</button><p class="ok" role="status"></p></form></section>`,
policies:s=>{const L=D.legal,o=L.entity+(L.reg?` (Reg. ${L.reg})`:'');const X=[['privacy','Privacy Policy (POPIA)',`<p>${o} is the responsible party under the Protection of Personal Information Act (POPIA). We collect only what you give us: contact and prayer forms (name, contact details, message) and giving details (name, email, amount, fund).</p><p>We use it to reply, process and receipt your gift, keep financial records and meet legal duties. We do not sell or share it, except with PayFast to process payments and service providers who deliver email or hosting. Card and bank details are entered on PayFast and never reach us or this site.</p><p>This site sets no tracking cookies. Embedded YouTube or Facebook content may set their own. You may ask to see, correct or delete your information at ${D.email}. Complaints: Information Regulator, inforegulator.org.za.</p>`],['terms','Terms and Conditions',`<p>By using this site or giving online you accept these terms. Prices and amounts are in South African rand (ZAR). Gifts are voluntary donations to ${o}, ${L.address}.</p><p>You confirm that you are authorised to use the payment method. We may decline or reverse a transaction we suspect is fraudulent. Content on this site belongs to the church and may not be reused without permission. South African law governs these terms.</p>`],['refunds','Giving and Refund Policy',`<p>Tithes, offerings, seeds and partnership gifts are voluntary and given to God’s work. They are generally non-refundable. If you gave twice by mistake or entered a wrong amount, contact us within 7 days at ${D.email} with your PayFast payment reference and we will review it. Approved refunds return to the original payment method.</p><p>Conference registrations, if offered, can be transferred to another person before the event. Section 18 CPA cooling-off rights do not apply to donations.</p>`],['delivery','Delivery Policy',`<p>We sell no physical goods. Gifts are received instantly and a PayFast receipt is emailed to you. Services and events are delivered in person or online as announced.</p>`],['security','Payment Security',`<p>Online payments are processed by PayFast (payfast.co.za), which is PCI DSS compliant. You are redirected to PayFast's secure page to pay by card, Instant EFT or another method it offers. This site never sees or stores your card or bank login details.</p>`]];return pageHead('Policies')+`<section class="sec w">${X.map(([k,t,b])=>`<details id="p-${k}" ${s==k?'open':''}><summary>${t}</summary><div>${b}</div></details>`).join('')}<p class="sm mute">Contact: ${D.email} · ${D.phone.map(p=>p[1]).join(' / ')}</p></section>`}
};
/* ===== routing and behaviour ===== */
function go(){const[,r='',s]=location.hash.slice(1).split('/'),k=r||'';document.title=(k?P.find(p=>p[0]==k)?.[1]||({'branch':'Campus','event':'Event'}[k]||'Policies'):'Home')+' · Life In The Word';
 $('#app').innerHTML=(R[k||'home']||R.home)(s);scrollTo(0,0);$('#dr').classList.remove('on');$('#menu').setAttribute('aria-expanded','false');initReveals();
 $$('.tabs a,nav.top a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#/'+k));if(s)$('#p-'+s)?.scrollIntoView()}
$('#nt').innerHTML=P.filter(p=>!['contact','journal','pray','services'].includes(p[0])).map(p=>`<a href="#/${p[0]}">${p[1]}</a>`).join('')+'<a href="#/contact">Contact</a>';
$('#dl').innerHTML=P.map(p=>`<a href="#/${p[0]}">${p[1]}</a>`).join('');
$('#tb').innerHTML=tab.map(t=>{const p=P.find(x=>x[0]==t);return`<a href="#/${t}"><b>${p[2]}</b>${p[1]}</a>`}).join('');
$('#fl').innerHTML=['privacy','terms','refunds','delivery','security'].map(k=>`<a href="#/policies/${k}">${k=='refunds'?'Refund policy':k[0].toUpperCase()+k.slice(1)}</a>`).join('')+'<a href="#/contact">Contact</a>';
$('#yr').textContent=new Date().getFullYear();$('#menu').setAttribute('aria-expanded','false');$('#menu').setAttribute('aria-controls','dr');$('#menu').onclick=()=>{ $('#dr').classList.add('on');$('#menu').setAttribute('aria-expanded','true');$('#x').focus() };$('#x').onclick=closeDrawer;function closeDrawer(){ $('#dr').classList.remove('on');$('#menu').setAttribute('aria-expanded','false');$('#menu').focus() }document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#dr').classList.contains('on'))closeDrawer()});
let revealObserver;function initReveals(){if(revealObserver)revealObserver.disconnect();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');revealObserver.unobserve(entry.target)}}),{threshold:.08,rootMargin:'0px 0px -25px 0px'});$$('#app .sec:not(:first-child),#app .card,#app .event-card').forEach(el=>{el.classList.add('reveal');revealObserver.observe(el)})}addEventListener('scroll',()=>document.querySelector('header').classList.toggle('scrolled',scrollY>12),{passive:true});
addEventListener('hashchange',go);go();
document.addEventListener('click',e=>{const b=e.target.closest('[data-c]'),f=e.target.closest('figure[data-v]'),a=e.target.closest('[data-a]');
 if(b){const c=$('#'+b.dataset.c);c.scrollBy({left:b.dataset.d*c.firstElementChild.offsetWidth,behavior:'smooth'})}
 if(f&&!$('video',f)){const v=document.createElement('video');v.src=`assets/vid/${f.dataset.v}.mp4`;v.controls=v.autoplay=v.playsInline=true;v.setAttribute('playsinline','');f.querySelector('img').replaceWith(v);f.querySelector('.play').remove()}
 if(a){$('[name=amount]').value=a.dataset.a;$$('.amts button').forEach(x=>x.classList.toggle('on',x==a))}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
 if(f.id=='gf'){const er=$('#ge'),amt=+d.amount;er.textContent='';
  if(!(amt>=10))return er.textContent='Enter an amount of R10 or more.';if(!d.ok)return er.textContent='Please accept the policies to continue.';
  const body={...d,amount:amt.toFixed(2),ref:'LITW-'+Date.now().toString(36).toUpperCase(),item:'LITW: '+d.fund};
  if(!D.pf.signEndpoint)return er.textContent='Online giving is being switched on. Please use EFT for now.';
  try{const r=await(await fetch(D.pf.signEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json(),g=document.createElement('form');g.method='post';g.action=r.action;
   for(const[k,v]of Object.entries(r.fields)){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;g.append(i)}document.body.append(g);g.submit()}
  catch{er.textContent='We could not reach the payment service. Please try again or use EFT.'}return}
 const k=f.dataset.k,msg=`${k=='prayer'?'Prayer request':'Website message'}\nFrom: ${d.name||'Anonymous'} ${d.reach||''}\n${d.msg}`,ok=$('.ok',f);
 if(D.formEndpoint){try{await fetch(D.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({kind:k,...d})});ok.textContent='Thank you. Your message has been sent.';f.reset();return}catch{}}
 open(k=='prayer'?`https://wa.me/${T(D.prayerTo).slice(1)}?text=${encodeURIComponent(msg)}`:`mailto:${D.email}?subject=${encodeURIComponent('Website message')}&body=${encodeURIComponent(msg)}`,'_blank');ok.textContent='Almost done: send the message in the app that just opened.'});
</script></body></html>
